<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BIOBUZZ field CAD preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14171c; overflow: hidden; }
      #host { position: fixed; inset: 0; }
      #host canvas { display: block; width: 100%; height: 100%; }
      #controls {
        position: fixed; top: 8px; left: 8px; z-index: 10; display: flex; gap: 8px;
        font: 14px system-ui, sans-serif;
      }
      button { padding: 6px 10px; cursor: pointer; }
      #status {
        position: fixed; bottom: 8px; left: 8px; z-index: 10; color: #eee;
        font: 12px ui-monospace, monospace; white-space: pre; max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="controls">
      <button id="qualityBtn">Quality: high</button>
      <button id="viewBtn">View: overhead</button>
    </div>
    <div id="status">loading...</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
